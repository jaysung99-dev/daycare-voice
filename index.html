<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日照語音紀錄</title>
<meta name="theme-color" content="#2e7d6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--g:#2e7d6b;--g2:#e7f2ef;--r:#c62828;--y:#b26a00;--line:#dde5e2;--bg:#f3f6f5}
*{box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;margin:0;background:var(--bg);color:#1d2a27;font-size:16px;-webkit-text-size-adjust:100%}
header{background:var(--g);color:#fff;padding:10px 14px calc(0px);position:sticky;top:0;z-index:5;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:19px;margin:0 0 8px;font-weight:700}
header h1 small{font-weight:400;opacity:.75;font-size:13px;margin-left:6px}
nav{display:flex;gap:4px}
nav button{flex:1;background:transparent;color:#d6ebe5;border:0;border-bottom:3px solid transparent;padding:9px 4px 8px;font-size:16px;border-radius:0}
nav button.on{color:#fff;border-bottom-color:#fff;font-weight:700}
main{padding:12px;max-width:1180px;margin:auto}
.tab{display:none}.tab.on{display:block}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001;border:1px solid var(--line)}
.card h2{font-size:17px;margin:0 0 8px}
.hint{color:#5b6b67;font-size:14px;line-height:1.5;margin:4px 0 8px}
textarea{width:100%;min-height:96px;font-size:17px;padding:10px;border:1px solid #c8d3cf;border-radius:8px;font-family:inherit}
input,select{font-size:17px;padding:8px;border:1px solid #c8d3cf;border-radius:8px;width:100%;min-width:0;background:#fff;font-family:inherit}
button{font-size:16px;padding:11px 16px;border:0;border-radius:10px;background:var(--g);color:#fff;font-family:inherit;cursor:pointer;touch-action:manipulation}
button.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
button.gray{background:#7b8a86}
button:disabled{opacity:.45}
.mic{width:100%;font-size:21px;padding:18px;border-radius:14px;margin:8px 0;font-weight:700;letter-spacing:1px}
.mic.rec{background:var(--r);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #c6282822}}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.interim{color:#6c7b77;min-height:1.4em;font-size:16px;margin-top:6px}
.status{font-size:14px;color:var(--g);min-height:1.3em}
.status.err{color:var(--r)}
.rec-card{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.rec-card.warn{border-color:#f0c36d}
.rec-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.rec-head select{font-size:19px;font-weight:700}
.f{display:grid;grid-template-columns:88px 1fr 46px;gap:6px;align-items:start;padding:7px 0;border-top:1px solid #eef2f0}
.f label{padding-top:9px;font-size:15px;color:#3c4b47}
.f .ctl{display:flex;gap:6px;flex-wrap:wrap}.f .ctl>*{flex:1 1 110px}
.f .w{grid-column:2/4;font-size:13.5px;color:var(--r);margin-top:-2px}
.f .w.soft{color:var(--y)}
.f.bad{background:#fff3f3}
.fm{padding:8px 0;font-size:18px;border-radius:8px;background:#5a8f83}
.fm.rec{background:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--g2);color:#1f5a4c;border-radius:999px;padding:4px 10px;font-size:14px}
.chip.r{background:#fde7e7;color:var(--r)}
.scn{font-size:18px;line-height:1.9}
.scn b{display:inline-block;min-width:72px;color:#41524e;font-weight:600}
.scn .who{font-size:22px;font-weight:800;color:var(--g)}
.score{font-size:40px;font-weight:800;color:var(--g);text-align:center;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border-bottom:1px solid #e5ebe9;padding:7px 6px;text-align:left;vertical-align:top}
th{color:#51625d;font-weight:600;background:#f7faf9}
.ok{color:#1f7a3a;font-weight:700}.ng{color:var(--r);font-weight:700}
.tablewrap{overflow-x:auto}
.seg{display:flex;border:1px solid var(--g);border-radius:10px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:#fff;color:var(--g);padding:9px}
.seg button.on{background:var(--g);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2a27;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
@media (min-width:900px){
  .two{display:grid;grid-template-columns:minmax(340px,5fr) 7fr;gap:14px;align-items:start}
  .two>.sticky{position:sticky;top:96px}
  body{font-size:17px}
}
</style>
</head>
<body>
<header>
  <h1>🎙️ 日照語音紀錄<small>v3</small></h1>
  <nav><button data-tab="rec" class="on">日常紀錄</button><button data-tab="drill">操演練習</button><button data-tab="list">已存紀錄</button></nav>
</header>
<main>
<!-- 日常紀錄 -->
<section id="tab-rec" class="tab on"><div class="two">
  <div class="sticky">
    <div class="card">
      <h2>1. 用說的</h2>
      <div class="hint">自然講就好，順序不拘；可以一次講兩位長輩，講錯直接說「不對，是…」。</div>
      <button id="recMic" class="mic">🎤 開始錄音</button>
      <div id="recInterim" class="interim"></div>
      <textarea id="recTxt" placeholder="也可以直接打字，例如：秀英阿嬤體溫三十六度半，血壓一百二十八十，午餐吃一半，十點藥有吃，沒有跌倒"></textarea>
      <div class="row" style="margin-top:8px"><button id="recParse">🧠 解析</button><button id="recClear" class="gray">清除</button></div>
      <div id="recStatus" class="status"></div>
    </div>
  </div>
  <div>
    <div class="card"><h2>2. 確認後存檔</h2><div class="hint">黃色＝請再確認；紅色＝必填或數值不合理。每格右邊的 🎤 可以只補講那一格。</div>
      <div id="recCards"></div>
      <div class="row"><button id="recSaveAll">✅ 全部存檔</button></div>
    </div>
  </div>
</div></section>

<!-- 操演練習 -->
<section id="tab-drill" class="tab"><div class="two">
  <div class="sticky">
    <div class="card">
      <h2>情境題</h2>
      <div class="row" style="margin-bottom:10px"><div class="seg" id="drillLevel"><button data-v="basic" class="on">基本 5 項</button><button data-v="full">完整 10 項</button></div></div>
      <div id="drillScn" class="scn"></div>
      <div class="hint">看完上面的交班內容，<b>用你自己的話</b>講一次，不必照念、順序不拘。</div>
      <button id="drillMic" class="mic">🎤 開始作答</button>
      <div id="drillInterim" class="interim"></div>
      <textarea id="drillTxt" placeholder="辨識出的文字會出現在這裡，也可以打字作答"></textarea>
      <div class="row" style="margin-top:8px"><button id="drillGrade">📝 評分</button><button id="drillNext" class="ghost">下一題 ➜</button></div>
      <div id="drillStatus" class="status"></div>
    </div>
  </div>
  <div>
    <div class="card" id="drillResultCard" style="display:none"><h2>本題結果</h2><div id="drillScore" class="score"></div><div class="tablewrap"><table id="drillTable"></table></div></div>
    <div class="card"><h2>本機練習統計</h2><div id="drillStats" class="hint">還沒有作答紀錄。</div>
      <div class="row"><button id="drillExport" class="ghost">⬇️ 匯出練習結果 CSV</button><button id="drillReset" class="gray">清空統計</button></div></div>
  </div>
</div></section>

<!-- 已存紀錄 -->
<section id="tab-list" class="tab">
  <div class="card"><h2>今日進度</h2><div id="todayChips" class="chips"></div></div>
  <div class="card"><h2>已存紀錄（只存在這台裝置）</h2>
    <div class="tablewrap"><table id="listTable"></table></div>
    <div class="row" style="margin-top:10px"><button id="listExport" class="ghost">⬇️ 匯出 CSV</button><button id="listClear" class="gray">清空全部</button></div>
  </div>
</section>
</main>
<div id="toast" class="toast"></div>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
